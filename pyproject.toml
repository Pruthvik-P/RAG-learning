[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-learning"
version = "0.1.0"
description = "A from-scratch, learn-by-reading RAG pipeline (DeepSeek-powered)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # core runs on the standard library only

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.5.0"]
pdf = ["pypdf>=4.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
